{% extends "base.html" %}

{% block content %}
<main class="ec-login-real" aria-label="ENTLASS-CONNECT Anmeldung">

  <div class="ec-login-canvas">

    <!-- STATIC BACKGROUND -->
    <img
      class="ec-login-art"
      src="{{ url_for('static', filename='login-background.png') }}"
      alt=""
      aria-hidden="true"
    >

    <!-- REAL FUNCTIONAL LOGIN -->
    <section class="ec-login-panel" aria-label="Anmelden">

      <div class="ec-login-panel-inner">

        <h1>Anmelden</h1>

        <p class="ec-login-welcome">
          Willkommen bei ENTLASS-CONNECT
        </p>

        {% if error %}
        <div class="ec-login-error" role="alert">
          {{ error }}
          <style>
/* =========================================================
   ENTLASS-CONNECT
   iOS / MOBILE LOGO FIX
   ========================================================= */

html,
body {
    width: 100%;
    max-width: 100%;
    margin: 0;
    padding: 0;
    overflow-x: hidden;
    box-sizing: border-box;
}

*,
*::before,
*::after {
    box-sizing: border-box;
}


/* ---------------------------------------------------------
   MOBILE – iPhone / Android
   --------------------------------------------------------- */

@media screen and (max-width: 768px) {

    .logo-stage {
        width: 100% !important;
        max-width: 100% !important;
        margin-left: auto !important;
        margin-right: auto !important;
        padding-left: 10px !important;
        padding-right: 10px !important;
        overflow: hidden !important;
        box-sizing: border-box !important;
    }

    .logo-stage img,
    .logo-stage .ec-logo-img,
    .ec-logo-img {
        display: block !important;
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
        margin-left: auto !important;
        margin-right: auto !important;
        object-fit: contain !important;
        box-sizing: border-box !important;
    }

    /* Mos lejo tekstin/logo-n jashtë ekranit */
    .logo-stage *,
    .hero *,
    .branding * {
        max-width: 100%;
    }

    /* Hero / pjesa e sipërme */
    .hero,
    .branding,
    .login-hero {
        width: 100% !important;
        max-width: 100% !important;
        overflow: hidden !important;
    }

}


/* ---------------------------------------------------------
   SMALL iPHONE
   --------------------------------------------------------- */

@media screen and (max-width: 520px) {

    .logo-stage {
        padding-left: 8px !important;
        padding-right: 8px !important;
    }

    .logo-stage img,
    .logo-stage .ec-logo-img,
    .ec-logo-img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
    }

}


/* ---------------------------------------------------------
   VERY SMALL iPHONE
   --------------------------------------------------------- */

@media screen and (max-width: 390px) {

    .logo-stage {
        padding-left: 5px !important;
        padding-right: 5px !important;
    }

    .logo-stage img,
    .logo-stage .ec-logo-img,
    .ec-logo-img {
        width: 100% !important;
        max-width: 100% !important;
        height: auto !important;
    }

}
</style>
        </div>
        {% endif %}

        <form
          class="ec-login-hotform"
          method="post"
          action="{{ url_for('login') }}"
          autocomplete="on"
        >

          <div class="ec-login-field">
            <label for="ec-username">Benutzername</label>

            <input
              id="ec-username"
              name="username"
              type="text"
              autocomplete="username"
              placeholder="Benutzername"
              required
              aria-label="Benutzername"
            >
          </div>

          <div class="ec-login-field">
            <label for="ec-password">Passwort</label>

            <input
              id="ec-password"
              name="password"
              type="password"
              autocomplete="current-password"
              placeholder="Passwort"
              required
              aria-label="Passwort"
            >
          </div>

          <label class="ec-remember">
            <input
              type="checkbox"
              name="remember"
              value="1"
              aria-label="Angemeldet bleiben"
            >
            <span>Angemeldet bleiben</span>
          </label>

          <button
            class="ec-login-submit"
            type="submit"
          >
            Einloggen →
          </button>

          <a
            class="ec-login-forgot"
            href="#"
          >
            Passwort vergessen?
          </a>

        </form>

      </div>

    </section>

  </div>

</main>
{% endblock %}

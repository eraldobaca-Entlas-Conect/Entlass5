<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#062b43">

<title>ENTLASS-CONNECT · Anmeldung</title>

<style>
*{box-sizing:border-box}

html,body{
    margin:0;
    padding:0;
    width:100%;
    min-height:100%;
    font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    background:#062b43;
}

body{
    overflow:hidden;
}

/* =====================================================
   DESKTOP — ORIGINAL ENTLASS-CONNECT ARTWORK
   The artwork already contains the logo, van, road,
   Frankfurt skyline and decorative right-side curves.
   ===================================================== */

.desktop-login{
    position:relative;
    width:100%;
    height:100dvh;
    min-height:700px;
    overflow:hidden;

    background:#062b43 url("{{ url_for('static', filename='login-background.png') }}")
               center center / cover no-repeat;
}

/* =====================================================
   LOGIN CARD
   Positioned on the empty right side of the artwork.
   ===================================================== */

.login-card{
    position:absolute;
    z-index:10;

    top:50%;
    right:5.2%;
    transform:translateY(-50%);

    width:min(460px, 31vw);

    padding:42px 42px 38px;

    background:
        linear-gradient(
            145deg,
            rgba(35,82,119,.96),
            rgba(8,45,70,.97)
        );

    border:1px solid rgba(255,255,255,.22);
    border-radius:28px;

    box-shadow:
        0 30px 80px rgba(0,0,0,.40);
}

.login-card h2{
    margin:0 0 12px;
    text-align:center;
    color:#fff;
    font-size:14px;
    letter-spacing:4px;
    font-weight:800;
}

.login-card h1{
    margin:0 0 14px;
    text-align:center;
    color:#fff;
    font-size:clamp(36px,3.0vw,50px);
    line-height:1.05;
    font-weight:800;
}

.login-description{
    margin:0 0 32px;
    text-align:center;
    color:rgba(255,255,255,.82);
    font-size:16px;
    line-height:1.5;
}

/* =====================================================
   FORM
   ===================================================== */

.login-form{
    width:100%;
}

.field{
    margin-bottom:19px;
}

.field label{
    display:block;
    margin-bottom:8px;
    color:#fff;
    font-size:14px;
    font-weight:700;
}

.field input{
    width:100%;
    height:58px;
    padding:0 18px;

    border:1px solid rgba(255,255,255,.28);
    border-radius:14px;

    background:rgba(205,220,232,.88);
    color:#12384f;

    font-size:16px;
    outline:none;

    transition:border-color .2s,box-shadow .2s;
}

.field input::placeholder{
    color:rgba(40,65,82,.58);
}

.field input:focus{
    border-color:#21d7cf;
    box-shadow:0 0 0 3px rgba(33,215,207,.18);
}

.password-wrap{
    position:relative;
}

.password-wrap input{
    padding-right:54px;
}

.password-eye{
    position:absolute;
    right:5px;
    top:6px;

    width:46px;
    height:46px;

    border:0;
    background:transparent;

    cursor:pointer;
    font-size:19px;
    color:#fff;
}

/* =====================================================
   BUTTON
   ===================================================== */

.login-button{
    width:100%;
    height:58px;
    margin-top:9px;

    border:0;
    border-radius:14px;

    background:linear-gradient(135deg,#13d6cb 0%,#18bcae 100%);
    color:#fff;

    font-size:17px;
    font-weight:800;

    cursor:pointer;

    box-shadow:0 10px 26px rgba(10,210,195,.25);
    transition:transform .15s,box-shadow .15s;
}

.login-button:hover{
    box-shadow:0 14px 32px rgba(10,210,195,.38);
}

.login-button:active{
    transform:translateY(1px);
}

/* =====================================================
   ERROR
   ===================================================== */

.error{
    margin-top:14px;
    padding:11px;

    border-radius:10px;

    background:rgba(255,70,80,.15);
    border:1px solid rgba(255,120,130,.25);

    color:#fff;
    font-size:13px;
    text-align:center;
    font-weight:700;
}

/* =====================================================
   PC / LAPTOP RESPONSIVE
   ===================================================== */

@media (max-width:1200px){
    .login-card{
        right:3%;
        width:390px;
        padding:34px 32px 32px;
    }
}

@media (max-width:900px){
    /*
      The Flask app routes phones/tablets to
      login_mobile_.html, so this template intentionally
      remains the desktop version.
    */
    .login-card{
        right:2%;
        width:370px;
    }
}
</style>
</head>

<body>

<div class="desktop-login">

    <div class="login-card">

        <h2>SICHER ANMELDEN</h2>

        <h1>
            Willkommen<br>
            zurück.
        </h1>

        <p class="login-description">
            Melden Sie sich mit Ihrem
            ENTLASS-CONNECT Zugang an.
        </p>

        <form
            class="login-form"
            method="post"
            action="{{ url_for('login') }}"
            autocomplete="on">

            <div class="field">
                <label for="desktop-username">
                    Benutzername
                </label>

                <input
                    id="desktop-username"
                    name="username"
                    type="text"
                    autocomplete="username"
                    autocapitalize="none"
                    autocorrect="off"
                    spellcheck="false"
                    placeholder="Benutzername eingeben"
                    required>
            </div>

            <div class="field">
                <label for="desktop-password">
                    Passwort
                </label>

                <div class="password-wrap">
                    <input
                        id="desktop-password"
                        name="password"
                        type="password"
                        autocomplete="current-password"
                        placeholder="Passwort eingeben"
                        required>

                    <button
                        type="button"
                        class="password-eye"
                        onclick="togglePassword('desktop-password', this)"
                        aria-label="Passwort anzeigen">
                        👁
                    </button>
                </div>
            </div>

            <button
                type="submit"
                class="login-button">
                Anmelden →
            </button>

            {% if error %}
            <div class="error">
                {{ error }}
            </div>
            {% endif %}

        </form>
    </div>

</div>

<script>
function togglePassword(id, button){
    const input=document.getElementById(id);
    if(!input) return;

    if(input.type==="password"){
        input.type="text";
        button.textContent="🙈";
        button.setAttribute("aria-label","Passwort verbergen");
    }else{
        input.type="password";
        button.textContent="👁";
        button.setAttribute("aria-label","Passwort anzeigen");
    }
}
</script>

</body>
</html>

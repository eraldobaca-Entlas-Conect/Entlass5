<title>ENTLASS-CONNECT</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#063b5c}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;color:#fff}
.mobile{display:none}
@media(max-width:768px){
.mobile{display:block;min-height:100dvh;background:linear-gradient(155deg,#063653,#075174 50%,#043a59);overflow:hidden}
.brand{height:665px;position:relative;text-align:center;padding-top:125px;overflow:hidden}
.logo{width:190px;height:190px;object-fit:cover;display:block;margin:auto}
.name{margin-top:24px;font-size:42px;font-weight:800;white-space:nowrap}.name span{color:#20d8e8}
.line{width:72px;height:5px;background:#20d8e8;border-radius:5px;margin:14px auto}
.wave{position:absolute;left:-100px;right:-100px;bottom:15px;height:150px;border-top:7px solid #18cddd;border-radius:50%;transform:rotate(7deg)}
.login{margin:0 12px;padding:48px 26px 35px;border:1px solid rgba(180,225,245,.4);border-radius:36px 36px 0 0;background:linear-gradient(145deg,rgba(42,111,157,.96),rgba(5,57,88,.98));box-shadow:0 -10px 35px rgba(0,0,0,.2)}
.eyebrow{text-align:center;font-size:14px;font-weight:800;letter-spacing:.3em;margin:0 0 12px}h1{text-align:center;font-size:54px;margin:0}.sub{text-align:center;font-size:18px;line-height:1.45;color:#dcebf3;margin:18px 0 34px}
.field{margin-bottom:21px}label{display:block;font-weight:750;font-size:17px;margin-bottom:9px}
input{width:100%;height:62px;border-radius:19px;border:1px solid rgba(255,255,255,.6);padding:0 18px;background:rgba(221,236,247,.82);font-size:18px;color:#073d5b;outline:0}input::placeholder{color:#5d7890}
.pass{position:relative}.eye{position:absolute;right:8px;top:8px;width:45px;height:45px;border:0;background:transparent;color:#0b496d;font-size:21px}
.submit{width:100%;height:62px;border:0;border-radius:19px;background:linear-gradient(100deg,#16cfd4,#12d9c5);color:white;font-size:21px;font-weight:800}
.error{margin:20px 0 0;padding:11px;border-radius:14px;background:rgba(110,45,75,.55);border:1px solid rgba(255,120,140,.5);text-align:center}
}

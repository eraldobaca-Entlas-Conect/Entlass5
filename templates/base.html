<!doctype html><html lang="de"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title or "ENTLASS-CONNECT" }}</title>
<link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}">
</head><body>
<header class="top"><a class="brand" href="{{ url_for('dashboard') if session_user and session_role!='driver' else url_for('driver') if session_user else url_for('login') }}">
<img src="{{ url_for('static',filename='img/logo.jpeg') }}"><span><b>ENTLASS</b><strong>CONNECT</strong><small>DIGITAL. SICHER. GEMEINSAM.</small></span></a>
{% if session_user %}<div class="user">{{ session_user }} · {{ session_role }} <a href="{{ url_for('logout') }}">Abmelden</a></div>{% endif %}
</header>
{% block content %}{% endblock %}
</body></html>
